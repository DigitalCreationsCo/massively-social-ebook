name: Fly Deploy
on:
  push:
    branches:
      - production

permissions:
  contents: write

jobs:
  deploy:
    name: Validate, Build, and Deploy
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-group
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # essential for the machine to see global registry tags

      - name: Verify Manifest Integrity
        id: validator
        run: |
          # 1. extract semantic version from manifest
          local_version=$(node -p "require('./package.json').version")
          
          # 2. synchronize with global registry and check for collisions
          # we check if a tag for this semantic version already exists
          if git rev-parse "v${local_version}" >/dev/null 2>&1; then
            echo "[-] critical: manifest collision detected at v${local_version}."
            echo "[-] sequence halted: version already exists in global registry."
            echo "[-] action: increment package.json version to resume pipeline."
            exit 1
          fi
          
          # 3. generate comprehensive build identity
          tag_identity="v${local_version}-build.${{ github.run_number }}"
          echo "full_tag=${tag_identity}" >> $GITHUB_OUTPUT
          echo "[+] validation successful: manifest increment verified."

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Execute Autonomous Deployment
        run: |
          flyctl deploy --remote-only \
            --build-arg APP_BUILD_TAG=${{ steps.validator.outputs.full_tag }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Synchronize Global Registry
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.validator.outputs.full_tag }}
          name: Release ${{ steps.validator.outputs.full_tag }}
          body: "autonomous production release for build ${{ github.run_number }}"
          target_commitish: production
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}