name: Fly Deploy
on:
  push:
    branches:
      - production

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate Build Metadata
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-build.${{ github.run_number }}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - uses: superfly/flyctl-actions/setup-flyctl@master
      
      # FIX: We pass the ARG so the Docker build can bake it in
      - name: Deploy to Fly
        run: flyctl deploy --remote-only --build-arg APP_BUILD_TAG=${{ steps.meta.outputs.TAG }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # FIX: Create the release ONLY if deploy succeeded
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          name: Release ${{ steps.meta.outputs.TAG }}
          body: "Automated production release for build ${{ github.run_number }}"
          target_commitish: production
          generate_release_notes: true
