# fly.toml app configuration file generated for a Next.js client and Express backend
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "massively-social-ebook"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5001"
  NODE_ENV = "production"

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
