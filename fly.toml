# fly.toml app configuration file generated for a Next.js client and Express backend
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "massively-social-ebook"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  builder = "fly-builder/pack"

[env]
  PORT = "5001"
  NODE_ENV = "production"

[[services]]
  protocol = "tcp"
  internal_port = 5001

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "1s"

[mounts]
  source="data"
  destination="/data"

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
